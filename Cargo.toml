[package]
name = "spar"
version = "0.0.2"
edition = "2021"
description = "Multi-agent coding product: fleet TUI, dual backends, plan/review/arena/ship"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Himmelschmidt/spar"
homepage = "https://github.com/Himmelschmidt/spar"
documentation = "https://github.com/Himmelschmidt/spar#readme"
keywords = ["agents", "orchestration", "cli", "tui"]
categories = ["command-line-utilities", "development-tools"]
# Note: the crates.io name `spar` is taken by an unrelated project.
# Install from this git repository (see README).

[[bin]]
name = "spar"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
dirs = "6"
portable-pty = "0.9"
ratatui = "0.29"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tui-term = "0.2"
ureq = { version = "3.3.0", features = ["json"] }
uuid = { version = "1", features = ["v4", "serde"] }
vt100 = "0.15"
which = "7"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = "1"

[[test]]
name = "plan_implement"
path = "tests/scenarios/plan_implement.rs"

[[test]]
name = "one_run"
path = "tests/scenarios/one_run.rs"

[[test]]
name = "roles_config"
path = "tests/scenarios/roles_config.rs"

[[test]]
name = "liveness"
path = "tests/scenarios/liveness.rs"

[[test]]
name = "stop"
path = "tests/scenarios/stop.rs"

[[test]]
name = "amendment"
path = "tests/scenarios/amendment.rs"

[[test]]
name = "runlock"
path = "tests/scenarios/runlock.rs"

[[test]]
name = "bus_deliver"
path = "tests/scenarios/bus_deliver.rs"

[[test]]
name = "worktree_base"
path = "tests/scenarios/worktree_base.rs"

[[test]]
name = "run_config"
path = "tests/scenarios/run_config.rs"

[[test]]
name = "abandoned"
path = "tests/scenarios/abandoned.rs"

[[test]]
name = "cleanup_sweep"
path = "tests/scenarios/cleanup_sweep.rs"

[[test]]
name = "archive"
path = "tests/scenarios/archive.rs"

[[test]]
name = "contract_gate"
path = "tests/scenarios/contract_gate.rs"

[[test]]
name = "round_loop"
path = "tests/scenarios/round_loop.rs"

[[test]]
